version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: muskom-db
    environment:
      POSTGRES_USER: muskom
      POSTGRES_PASSWORD: muskom_password
      POSTGRES_DB: muskom
    ports:
      - "5432:5432"
    volumes:
      - muskom_data:/var/lib/postgresql/data
      - ../database/migrations:/docker-entrypoint-initdb.d # Auto-run migrations on init
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muskom -d muskom"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: muskom-redis
    ports:
      - "6380:6379"
    volumes:
      - muskom_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../apps/api
      dockerfile: ../../deploy/api/Dockerfile
    container_name: muskom-api
    environment:
      - DATABASE_URL=postgres://muskom:muskom_password@db:5432/muskom?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=muskom_rc2_secret_key
      - JWT_REFRESH_SECRET=muskom_rc2_refresh_secret_key
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
      - LOG_LEVEL=debug
      - MAX_UPLOAD_SIZE=5242880
    ports:
      - "3200:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../apps/frontend
      dockerfile: ../../deploy/frontend/Dockerfile
    container_name: muskom-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
    ports:
      - "3201:3000"
    depends_on:
      - api

  nginx:
    build:
      context: ../deploy/nginx
      dockerfile: Dockerfile
    container_name: muskom-nginx
    ports:
      - "8080:80"
    depends_on:
      - api
      - frontend

volumes:
  muskom_data:
  muskom_redis:
