x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    container_name: muskom-postgres
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-muskom}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_DB: ${DB_NAME:-muskom}
    volumes:
      - muskom-postgres-data:/var/lib/postgresql/data
    networks:
      - muskom-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-muskom} -d ${DB_NAME:-muskom}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  redis:
    container_name: muskom-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - muskom-redis-data:/data
    networks:
      - muskom-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  api:
    container_name: muskom-api
    image: muskom-api:latest
    build:
      context: ../apps/api
      dockerfile: ../../deploy/api/Dockerfile
    restart: unless-stopped
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://${DB_USER:-muskom}:${DB_PASSWORD:-secret}@postgres:5432/${DB_NAME:-muskom}?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-secret}
    networks:
      - muskom-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging: *default-logging

  frontend:
    container_name: muskom-frontend
    image: muskom-frontend:latest
    build:
      context: ../apps/frontend
      dockerfile: ../../deploy/frontend/Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - API_URL=http://api:8080
    networks:
      - muskom-network
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging: *default-logging

  nginx:
    container_name: muskom-nginx
    image: muskom-nginx:latest
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:80"
    networks:
      - muskom-network
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging: *default-logging

networks:
  muskom-network:
    name: muskom-network
    driver: bridge

volumes:
  muskom-postgres-data:
    name: muskom-postgres-data
  muskom-redis-data:
    name: muskom-redis-data
