name: muskom

services:
  db:
    image: postgres:15-alpine
    container_name: muskom-db
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - muskom_data:/var/lib/postgresql/data
      - ../database/migrations:/docker-entrypoint-initdb.d
      - ../database/seed:/seed
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muskom -d muskom"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: muskom-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - muskom_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../apps/api
      dockerfile: ../../deploy/api/Dockerfile
    container_name: muskom-api
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../apps/frontend
      dockerfile: ../../deploy/frontend/Dockerfile
    container_name: muskom-frontend
    restart: unless-stopped
    env_file: .env
    depends_on:
      - api

  nginx:
    build:
      context: ../deploy/nginx
      dockerfile: Dockerfile
    container_name: muskom-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api
      - frontend

volumes:
  muskom_data:
  muskom_redis:

networks:
  default:
    name: muskom-network
