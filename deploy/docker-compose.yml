name: muskom

services:
  db:
    image: postgres:15-alpine
    container_name: muskom-db
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - muskom_data:/var/lib/postgresql/data
      - ../database/migrations:/docker-entrypoint-initdb.d
      - ../database/seed:/seed
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muskom -d muskom"]
      interval: 5s
      timeout: 5s
      retries: 5
  migrator:
    image: postgres:15-alpine
    container_name: muskom-migrator
    restart: "no"
    env_file: .env
    volumes:
      - ../database/migrations:/migrations
    command: >
      sh -c "
        if [ -z \"$$DATABASE_URL\" ]; then
          echo 'ERROR: DATABASE_URL is not set';
          exit 1;
        fi

        echo '=== Database Connection Info (safe) ==='
        psql \"$$DATABASE_URL\" -c 'SELECT current_database() AS db_name, current_user AS db_user, inet_server_addr() AS db_host;'
        echo '========================================'

        psql \"$$DATABASE_URL\" -c 'CREATE TABLE IF NOT EXISTS schema_migrations (version VARCHAR PRIMARY KEY);' &&
        for f in $$(ls /migrations/*.sql | sort); do
          version=$$(basename $$f | cut -d'_' -f1);
          exists=$$(psql \"$$DATABASE_URL\" -tAc \"SELECT 1 FROM schema_migrations WHERE version='$$version'\");
          if [ \"$$exists\" != \"1\" ]; then
            echo \"Executing $$f...\";
            psql \"$$DATABASE_URL\" -f $$f &&
            psql \"$$DATABASE_URL\" -c \"INSERT INTO schema_migrations (version) VALUES ('$$version');\";
          else
            echo \"Skipping $$f, already applied.\";
          fi
        done

        echo '=== Post-migration Verification ==='
        psql \"$$DATABASE_URL\" -c 'SELECT current_database();'
        psql \"$$DATABASE_URL\" -c 'SELECT current_user;'
        psql \"$$DATABASE_URL\" -c \"SELECT to_regclass('public.email_logs');\"
        echo '==================================='
      "
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: muskom-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - muskom_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../apps/api
      dockerfile: ../../deploy/api/Dockerfile
    container_name: muskom-api
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../storage/uploads:/storage/uploads

  frontend:
    build:
      context: ../apps/frontend
      dockerfile: ../../deploy/frontend/Dockerfile
    container_name: muskom-frontend
    restart: unless-stopped
    env_file: .env
    environment:
      # Explicitly bind on 3000 to match nginx upstream
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      - api

  nginx:
    build:
      context: ../deploy/nginx
      dockerfile: Dockerfile
    container_name: muskom-nginx
    restart: unless-stopped
    env_file: .env
    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: "/etc/nginx"
      NGINX_ENVSUBST_TEMPLATE_DIR: "/etc/nginx/templates"
      NGINX_ENVSUBST_FILTER: "MAX_UPLOAD_SIZE"
      MAX_UPLOAD_SIZE: "${MAX_UPLOAD_SIZE:-10485760}"
    ports:
      - "80:80"
      - "8080:80"
    depends_on:
      - api
      - frontend

volumes:
  muskom_data:
  muskom_redis:

networks:
  default:
    name: muskom-network
